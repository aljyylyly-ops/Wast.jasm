<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سوق الصويرة</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><b>🛍️ سوق الصويرة</b><button onclick="openForm()">＋ نشر منتج</button></header><main><section class="hero"><h1>كلشي تريده، بمكان واحد</h1><p>منتجات من الصويرة والعراق، مع اتصال وواتساب مباشر.</p></section><input id="search" oninput="render()" placeholder="🔎 ابحث عن منتج..."><div id="cats"></div><h2>المنتجات المنشورة</h2><section id="products">جاري التحميل...</section></main><div id="modal" class="modal hidden"><div class="box"><button onclick="closeForm()">×</button><h2>نشر منتج</h2><form onsubmit="add(event)"><input id="name" required placeholder="اسم المنتج"><input id="price" required type="number" min="0" placeholder="السعر بالدينار"><select id="category"></select><select id="city"><option>واسط</option><option>بغداد</option><option>الديوانية</option><option>بابل</option><option>النجف</option><option>كربلاء</option><option>البصرة</option><option>أربيل</option><option>نينوى</option><option>كل العراق</option></select><input id="phone" required placeholder="رقم الهاتف"><input id="image" type="url" placeholder="رابط صورة المنتج"><textarea id="description" placeholder="وصف المنتج"></textarea><button type="submit">إرسال للمراجعة</button></form></div></div><script src="app.js"></script></body></html>
