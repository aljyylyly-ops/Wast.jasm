<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سوق الصويرة</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- شريط الرأس -->
<header>
  <div class="header-inner">
    <div class="logo">🛍️ سوق الصويرة</div>
    <div class="header-buttons">
      <button class="admin-btn" onclick="openAdmin()">⚙️ المدير</button>
      <button class="publish-btn" onclick="openForm()">＋ نشر منتج</button>
    </div>
  </div>
</header>

<!-- قسم البداية -->
<section class="hero">
  <h1>مرحباً بكم في سوق الصويرة</h1>
  <p>منتجاتكم بين يديكم — تصفح، تواصل، وتسوق بكل سهولة</p>
</section>

<!-- شريط البحث -->
<div class="search-wrapper">
  <input id="search" oninput="render()" placeholder="🔎 ابحث عن منتج بالاسم أو التصنيف...">
</div>

<!-- التصنيفات -->
<div id="cats" class="categories"></div>

<!-- لوحة تحكم المدير -->
<section class="admin-panel" id="adminPanel">
  <h3>🔧 لوحة التحكم — المنتجات بانتظار الموافقة</h3>
  <div id="pendingList"></div>
</section>

<!-- عرض المنتجات -->
<main>
  <h2 class="section-title">المنتجات المعروضة</h2>
  <section id="products" class="loading">جاري التحميل...</section>
</main>

<!-- نافذة نشر منتج جديد -->
<div id="modal" class="modal hidden">
  <div class="box">
    <button class="close-btn" onclick="closeForm()">×</button>
    <h2>📤 نشر منتج جديد</h2>
    <form id="productForm" onsubmit="add(event)">
      <label>اسم المنتج *</label>
      <input id="name" required placeholder="مثال: هاتف شاومي جديد">
      
      <label>السعر</label>
      <input id="price" placeholder="اتركه فارغاً إن كان السعر عند الاتصال">
      
      <label>التصنيف *</label>
      <select id="category" required></select>
      
      <label>المدينة *</label>
      <select id="city" required></select>
      
      <label>رقم الهاتف / الواتساب *</label>
      <input id="phone" required placeholder="مثال: 07701234567">
      
      <label>رابط صورة المنتج</label>
      <input id="image" type="url" placeholder="انصح برفع الصورة على موقع مثل imgur.com وانسخ الرابط">
      
      <label>وصف المنتج</label>
      <textarea id="description" rows="3" placeholder="أضف وصفاً موجزاً لمنتجك..."></textarea>
      
      <button type="submit" class="submit-btn">إرسال للمراجعة ➜</button>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
